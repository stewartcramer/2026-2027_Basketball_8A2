<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wayzata Basketball 8A2</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-navy: #102a45;
            --accent-gold: #f0b429;
            --bg-color: #ffffff;
            --card-bg: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        /* Mobile Container Simulation */
        .mobile-frame {
            width: 100%;
            max-width: 400px;
            background-color: var(--bg-color);
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 8px solid #0f172a;
            position: relative;
        }

        /* Header Section */
        header {
            padding: 24px 20px 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e2e8f0;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            width: 44px;
            height: 44px;
            object-fit: contain;
        }

        .header-title h1 {
            font-size: 1rem;
            font-weight: 800;
            color: var(--primary-navy);
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header-title p {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .profile-btn {
            background: var(--card-bg);
            border: 1px solid #cbd5e1;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Main Content */
        .content {
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .hero-banner {
            text-align: center;
            background: transparent; /* Removes the white/gray card box behind the logo */
            padding: 10px 20px;
            border: none;
        }

        .hero-banner img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 8px;
            background: transparent; /* Ensures no background renders */
            filter: drop-shadow(0 4px 8px rgba(16, 42, 69, 0.2));
        }

        .hero-banner h2 {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--primary-navy);
            margin-bottom: 4px;
        }

        .hero-banner p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Navigation Buttons Grid */
        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-btn {
            background-color: var(--primary-navy);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            padding: 16px 20px;
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(16, 42, 69, 0.15);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .nav-btn:hover {
            background-color: #1a365d;
            transform: translateY(-2px);
        }

        .nav-btn .btn-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .nav-btn svg {
            width: 22px;
            height: 22px;
            fill: var(--accent-gold);
        }

        .arrow-icon {
            font-size: 1.1rem;
            color: var(--accent-gold);
        }

        /* Footer Info / Schedule Link */
        .footer-schedule {
            margin-top: 10px;
            text-align: center;
            padding-top: 16px;
            border-top: 1px dashed #cbd5e1;
        }

        .footer-schedule a {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary-navy);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .footer-schedule a:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>


        <!-- Header -->

            <!-- Footer Schedule Link -->
            <div class="footer-schedule">
                <a href="https://gobound.com/mn/mshsl/boysbasketball/2026-27/wayzata/v-2">
                    📅 2026-2027 Wayzata Varsity Basketball Schedule
                </a>
            </div>
        </div>

</body>
</html>
