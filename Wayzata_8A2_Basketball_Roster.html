<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wayzata Basketball 8A2 Roster</title>

<link rel="icon" type="image/png" href="wayzata_logo.png">

<style>
  :root {
    --wayzata-blue: #002B5C;
    --wayzata-gold: #FFC72C;
    --white: #FFFFFF;
  }

  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background-color: var(--wayzata-blue);
    color: var(--white);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    border: 6px solid var(--wayzata-gold);
    padding-bottom: 40px;
  }

  .logo {
    margin-top: 30px;
    width: 260px;
    max-width: 70%;
    height: auto;
    display: block;
  }

  h1 {
    font-size: 2.6em;
    color: var(--wayzata-gold);
    margin: 20px 0 30px 0;
    text-shadow: 2px 2px 4px #000;
    text-align: center;
  }

  table {
    width: 90%;
    max-width: 700px;
    border-collapse: collapse;
    margin-top: 10px;
  }

  th {
    font-size: 1.6em;
    padding: 12px;
    background-color: var(--wayzata-gold);
    color: var(--wayzata-blue);
    border-bottom: 4px solid var(--white);
  }

  td {
    font-size: 1.4em;
    padding: 12px;
    border-bottom: 2px solid var(--white);
    white-space: nowrap; /* Prevent wrapping */
  }

  td.number {
    width: 70px; /* Enough for 2 digits */
    text-align: center;
    font-weight: bold;
    color: var(--wayzata-gold);
  }

  @media (max-width: 768px) {
    h1 {
      font-size: 2.2em;
    }
    th, td {
      font-size: 1.2em;
      padding: 10px;
    }
    td.number {
      width: 55px;
    }
  }

  @media (max-width: 480px) {
    h1 {
      font-size: 1.8em;
    }
    th, td {
      font-size: 1.1em;
      padding: 8px;
    }
    td.number {
      width: 45px;
    }
  }
</style>
</head>

<body>
<h1>Wayzata Basketball 8A2 Roster</h1>

<table>
  <tr>
    <th>#</th>
    <th>Player</th>
  </tr>

  <tr><td class="number">00</td><td>Henry Adams</td></tr>
  <tr><td class="number">00</td><td>Chance Cramer</td></tr>
  <tr><td class="number">00</td><td>Darby Mason</td></tr>
  <tr><td class="number">00</td><td>Aiden Hoellein</td></tr>
  <tr><td class="number">00</td><td>Gavin Klein</td></tr>
  <tr><td class="number">00</td><td>Pavan Narasimha</td></tr>
  <tr><td class="number">00</td><td>Jackson Paukert</td></tr>
  <tr><td class="number">00</td><td>Kyle Pearson</td></tr>
  <tr><td class="number">00</td><td>Ethan Yopp</td></tr>

</table>

</body>
</html>
